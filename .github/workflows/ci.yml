name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build
      - name: Build local NuGet packages
        run: |
          dotnet pack src/OpenUtilityAPI.Core -c Release --no-build -o artifacts/packages
          dotnet pack src/OpenUtilityAPI.Brazil -c Release --no-build -o artifacts/packages
      - name: Verify production container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t openutilityapi:ci .
          docker run -d --name openutilityapi-ci -p 127.0.0.1:8080:8080 openutilityapi:ci
          trap 'docker logs openutilityapi-ci; docker rm -f openutilityapi-ci' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 http://localhost:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/swagger/index.html)" = 404
          curl --fail -H 'Content-Type: application/json' \
            --data '{"principal":1000,"ratePerPeriod":0.01,"periods":12}' \
            http://localhost:8080/api/v1/finance/compound-interest | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)["finalAmount"] == 1126.83'
          python3 -c 'import json; print(json.dumps({"text":"x" * 70000}))' > /tmp/oversized.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            --data-binary @/tmp/oversized.json http://localhost:8080/api/v1/text/normalize)" = 413
